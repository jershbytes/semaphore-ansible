---
# -------------------------------------------------
# SemaphoreUI version
# -------------------------------------------------
semaphore_version: "2.18.12"

# -------------------------------------------------
# Service user & group
# -------------------------------------------------
semaphore_user: semaphore
semaphore_group: semaphore
semaphore_user_home: /home/semaphore
semaphore_user_shell: /bin/bash

# -------------------------------------------------
# Paths
# -------------------------------------------------
semaphore_bin_dir: /usr/bin
semaphore_config_dir: /etc/semaphore
semaphore_data_dir: /var/lib/semaphore
semaphore_tmp_dir: /tmp/semaphore

# -------------------------------------------------
# Web server settings
# -------------------------------------------------
semaphore_web_host: "0.0.0.0"
semaphore_port: "3000"

# -------------------------------------------------
# Database backend: 'sqlite' (embedded SQLite),
# 'mysql', or 'postgres'
# -------------------------------------------------
semaphore_db_dialect: sqlite

# SQLite DB file path (used when semaphore_db_dialect == 'sqlite')
semaphore_sqlite_db_path: "{{ semaphore_data_dir }}/database.sqlite"

# MySQL / MariaDB settings (used when semaphore_db_dialect == 'mysql')
semaphore_mysql_host: "127.0.0.1:3306"
semaphore_mysql_user: semaphore
semaphore_mysql_password: "changeme_mysql"
semaphore_mysql_db: semaphore
# Root password used to create the DB/user (only needed for local install)
semaphore_mysql_root_password: ""
# Host from which the semaphore user connects (use '127.0.0.1' for local)
semaphore_mysql_client_host: "127.0.0.1"

# PostgreSQL settings (used when semaphore_db_dialect == 'postgres')
semaphore_postgres_host: "127.0.0.1:5432"
semaphore_postgres_user: semaphore
semaphore_postgres_password: "changeme_postgres"
semaphore_postgres_db: semaphore

# -------------------------------------------------
# Admin account (created on first run only)
# -------------------------------------------------
semaphore_admin_user: admin
semaphore_admin_password: "changeme"
semaphore_admin_email: "admin@localhost"
semaphore_admin_name: "Admin"

# -------------------------------------------------
# Systemd logging
# -------------------------------------------------
semaphore_syslog_enabled: true

# -------------------------------------------------
# Firewall (ufw) - open semaphore port
# -------------------------------------------------
semaphore_configure_ufw: false

# -------------------------------------------------
# GitHub release base URL (override for air-gapped envs)
# -------------------------------------------------
semaphore_release_base_url: "https://github.com/semaphoreui/semaphore/releases/download"

# -------------------------------------------------
# Caddy / xcaddy (optional)
# -------------------------------------------------
# Install xcaddy helper binary (requires Go toolchain)
semaphore_install_xcaddy: true

# If true, only install xcaddy and skip building caddy binary
semaphore_install_only_xcaddy: false

# Configure and run Caddy as a reverse proxy for SemaphoreUI.
semaphore_caddy_enable_https: true

# Public hostname for ACME certificates (example: semaphore.example.com).
# Leave empty to serve HTTPS with an internal Caddy certificate.
semaphore_caddy_domain: ""

# Upstream address used by Caddy to reach SemaphoreUI.
semaphore_caddy_upstream: "127.0.0.1:{{ semaphore_port }}"

# Paths for Caddy runtime configuration/state.
semaphore_caddy_config_dir: /etc/caddy
semaphore_caddy_config_file: "{{ semaphore_caddy_config_dir }}/Caddyfile"
semaphore_caddy_data_dir: /var/lib/caddy

# Go version used to install xcaddy
semaphore_go_version: "1.24.5"

# Architecture map for Go release artifacts
semaphore_go_arch_map:
  x86_64: amd64
  aarch64: arm64
  armv7l: armv6l
  armv6l: armv6l

# Resolved Go architecture for the target host
semaphore_go_arch: "{{ semaphore_go_arch_map[ansible_architecture] | default('amd64') }}"

# Install paths for Go and binaries
semaphore_go_root: /usr/local/go
semaphore_go_path: /opt/go
semaphore_xcaddy_bin_path: /usr/local/bin/xcaddy
semaphore_caddy_bin_path: /usr/local/bin/caddy

# Cloudflare API token for DNS-01 ACME challenge.
# Required when semaphore_caddy_domain is set; leave empty to use HTTP-01 challenge.
semaphore_caddy_cloudflare_api_token: ""

# DNS resolvers Caddy uses to verify DNS propagation during the Cloudflare challenge.
semaphore_caddy_dns_resolvers:
  - "1.1.1.1"
  - "1.0.0.1"

# Optional xcaddy plugins used when building caddy
# Example:
# semaphore_caddy_xcaddy_plugins:
#   - github.com/caddy-dns/cloudflare@latest
semaphore_caddy_xcaddy_plugins:
  - github.com/caddy-dns/cloudflare@latest
