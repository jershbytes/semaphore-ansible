[project]
name = "semaphore-ansible"
version = "1.0.0"
description = "Ansible automation for SemaphoreUI installation on Proxmox VMs and Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "ansible>=10.0.0",
    "ansible-lint>=24.0.0",
    "passlib>=1.7.4",          # needed by some ansible crypto modules
    "netaddr>=1.3.0",           # needed by ansible networking filters
    "jmespath>=1.0.1",          # needed by json_query filter
    "PyMySQL>=1.1.0",           # needed by community.mysql on controller
    "psycopg2-binary>=2.9.0",   # needed by community.postgresql on controller
]

[dependency-groups]
dev = [
    "yamllint>=1.35.0",
]

[tool.uv.pip]
index-url = "https://pypi.org/simple"
