---
all:
  children:
    proxmox_vms:
      hosts:
        semaphore-vm:
          ansible_host: 192.168.1.100  # Change to your Proxmox VM IP
          ansible_user: ubuntu          # Change to your VM user
          ansible_ssh_private_key_file: ~/.ssh/id_rsa

    raspberrypi:
      hosts:
        semaphore-pi:
          ansible_host: 192.168.1.101  # Change to your Raspberry Pi IP
          ansible_user: pi              # Default Pi user; adjust as needed
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
