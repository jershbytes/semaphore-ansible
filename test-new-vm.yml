---
# test-new-vm.yml — single-host validation playbook for a fresh VM
# Example:
#   ansible-playbook -i "192.168.1.150," test-new-vm.yml -u ubuntu --ask-become-pass

- name: Validate SemaphoreUI install on a new VM
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Ensure this playbook targets at least one host
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length > 0
        fail_msg: "No hosts were matched. Check your -i value and SSH user."

    - name: Verify target OS is Debian/Ubuntu based
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This role supports Debian/Ubuntu-based systems only.
          Detected OS family: {{ ansible_os_family }}

  tasks:
    - name: Apply local SemaphoreUI role
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}"

  post_tasks:
    - name: Print access information
      ansible.builtin.debug:
        msg:
          - "SemaphoreUI installation complete"
          - "Access URL: http://{{ ansible_host | default(inventory_hostname) }}:{{ semaphore_port }}"
          - "Admin user: {{ semaphore_admin_user }}"
