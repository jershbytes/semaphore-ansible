---
# Install Ansible and required pip packages into the service user's context

- name: Install pip requirements for semaphore service user
  ansible.builtin.pip:
    name: "{{ semaphore_pip_requirements }}"
    state: present
    extra_args: "--user --upgrade"
  become: true
  become_user: "{{ semaphore_user }}"
  when:
    - semaphore_install_ansible_pip | bool
    - not semaphore_use_venv | bool
    - semaphore_pip_requirements | length > 0

- name: Create Python virtual environment and install pip requirements
  ansible.builtin.pip:
    name: "{{ semaphore_pip_requirements }}"
    virtualenv: "{{ semaphore_venv_path }}"
    virtualenv_command: "/usr/bin/python3 -m venv"
    state: present
    extra_args: "--upgrade"
  become: true
  become_user: "{{ semaphore_user }}"
  when:
    - semaphore_install_ansible_pip | bool
    - semaphore_use_venv | bool
    - semaphore_pip_requirements | length > 0

- name: Upload Ansible Galaxy requirements file
  ansible.builtin.copy:
    src: "{{ semaphore_galaxy_requirements_file }}"
    dest: "{{ semaphore_user_home }}/requirements.yml"
    owner: "{{ semaphore_user }}"
    group: "{{ semaphore_group }}"
    mode: "0640"
  become: true
  when: semaphore_galaxy_requirements_file | length > 0

- name: Install Ansible Galaxy collections and roles (venv context)
  ansible.builtin.command:
    cmd: >-
      {{ semaphore_venv_path }}/bin/ansible-galaxy install
      --roles-path {{ semaphore_user_home }}/.ansible/roles
      --collections-path {{ semaphore_user_home }}/.ansible/collections
      -r {{ semaphore_user_home }}/requirements.yml
      --force
  register: semaphore_galaxy_install_venv
  changed_when: semaphore_galaxy_install_venv.rc == 0
  become: true
  become_user: "{{ semaphore_user }}"
  when:
    - semaphore_galaxy_requirements_file | length > 0
    - semaphore_use_venv | bool

- name: Install Ansible Galaxy collections and roles (user context)
  ansible.builtin.command:
    cmd: >-
      ansible-galaxy install
      --roles-path {{ semaphore_user_home }}/.ansible/roles
      --collections-path {{ semaphore_user_home }}/.ansible/collections
      -r {{ semaphore_user_home }}/requirements.yml
      --force
    creates: "{{ semaphore_user_home }}/.ansible"
  register: semaphore_galaxy_install_user
  changed_when: semaphore_galaxy_install_user.rc == 0
  become: true
  become_user: "{{ semaphore_user }}"
  when:
    - semaphore_galaxy_requirements_file | length > 0
    - not semaphore_use_venv | bool
