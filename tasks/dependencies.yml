---
- name: Install OS dependencies
  ansible.builtin.apt:
    name:
      - git
      - curl
      - wget
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  become: true

- name: Install Python dependencies for optional target-side Ansible tooling
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time | default(3600) }}"
  become: true
  when: semaphore_install_ansible_pip | bool

- name: Install python3-venv when target-side venv is enabled
  ansible.builtin.apt:
    name: python3-venv
    state: present
  become: true
  when:
    - semaphore_install_ansible_pip | bool
    - semaphore_use_venv | bool

- name: Install ufw (if firewall management is enabled)
  ansible.builtin.apt:
    name: ufw
    state: present
  become: true
  when: semaphore_configure_ufw | bool
